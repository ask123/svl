<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPL Season 1 · Print chits</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ background:#e9e9e6; }
  .toolbar{
    position:sticky; top:0; z-index:10; background:#111; color:#fff;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:12px 18px;
  }
  .toolbar h1{ font-size:16px; font-weight:800; margin-right:auto; }
  .toolbar button, .toolbar a{
    background:#fff; color:#111; border:none; border-radius:8px; padding:9px 14px;
    font-size:13px; font-weight:700; cursor:pointer; text-decoration:none;
  }
  .toolbar .hint{ font-size:12px; color:rgba(255,255,255,.7); width:100%; }

  .sheets{ padding:24px 12px 60px; }
  .sheet{
    background:#fff; width:210mm; min-height:297mm; margin:0 auto 24px;
    padding:12mm; box-shadow:0 8px 24px rgba(0,0,0,.18);
    display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:6mm;
    box-sizing:border-box;
  }
  .sheet-label{ text-align:center; font-size:12px; color:#666; margin:0 auto 6px; font-weight:700; }

  .chit{
    border:1.6px dashed #9a9a9a; border-radius:8px;
    padding:6mm; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; color:#111; position:relative; overflow:hidden; min-height:44mm;
  }
  .chit .cid{ position:absolute; top:4mm; right:5mm; font-size:10px; color:#aaa; font-weight:700; }
  .chit .cname{ font-size:20px; font-weight:800; letter-spacing:-0.01em; line-height:1.15; }
  .chit .cmeta{ font-size:13px; color:#555; margin-top:5mm; }

  /* team chits */
  .sheet.teams{ grid-auto-rows:auto; align-content:start; }
  .team-chit{
    border:2px solid var(--c,#111); border-radius:12px; min-height:46mm; gap:3mm;
  }
  .team-chit .clogo{ width:26mm; height:26mm; object-fit:contain; }
  .team-chit .cname{ font-size:24px; text-transform:uppercase; letter-spacing:.02em; }
  .team-chit .cmeta{ font-size:13px; color:#444; margin-top:2mm; }

  @media print{
    body{ background:#fff; }
    .toolbar{ display:none; }
    .sheets{ padding:0; }
    .sheet-label{ display:none; }
    .sheet{ box-shadow:none; margin:0; width:auto; min-height:auto; }
    @page{ size:A4; margin:10mm; }
    .sheet{ page-break-after:always; }
    .sheet:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <h1>🖨️ Auction chits — Season 1 · UNITY</h1>
  <button onclick="window.print()">Print / Save as PDF</button>
  <a href="index.html">← Back</a>
  <div class="hint">Prints 10 player chits per A4 page + a team-names page. Cut along the dashed lines. Tip: in the print dialog, turn OFF "Headers and footers".</div>
</div>

<div class="sheets" id="sheets"></div>

<script src="players.js"></script>
<script>
(function () {
  const posShort = (arr) => arr.map(p => POSITIONS[p] || p).join(' / ');
  const wrap = document.getElementById('sheets');
  let html = '';

  // ----- player chits, 10 per sheet -----
  const per = 10;
  const totalSheets = Math.ceil(PLAYERS.length / per);
  for (let s = 0; s < totalSheets; s++) {
    const group = PLAYERS.slice(s * per, s * per + per);
    html += `<div class="sheet-label no-print">Players — sheet ${s + 1} of ${totalSheets}</div>`;
    html += `<div class="sheet">` + group.map(p => `
      <div class="chit">
        <span class="cid">${p.id}</span>
        <div class="cname">${p.name}</div>
        <div class="cmeta">${p.age} &nbsp;·&nbsp; ${posShort(p.positions)}</div>
      </div>`).join('') + `</div>`;
  }

  // ----- team names sheet -----
  html += `<div class="sheet-label no-print">Team names</div>`;
  html += `<div class="sheet teams">` + TEAMS.map(t => `
    <div class="chit team-chit" style="--c:${t.primary}">
      <img class="clogo" src="${t.logo}" alt="">
      <div class="cname" style="color:${t.primary}">${t.name}</div>
      <div class="cmeta">${t.letter} · ${t.animal}</div>
    </div>`).join('') + `</div>`;

  wrap.innerHTML = html;
})();
</script>
</body>
</html>
